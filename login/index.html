<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotec</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>

<body>
    <header class="cabecalho">
        <a href="">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo do sistema Bibliotec.">
        </a>

        <nav class="navegacao">
            <a href="../home/index.html">Home</a>
        </nav>
    </header>

    <main class="conteudo">
        <div class="box-login">
            <div class="itens-topo">
                <img src="../imgs/Icone - Bibliotec.png" alt="">
                <h1>Bem-vindo(a) à Biblio Tec</h1>
                <p>Acesse sua conta para continuar</p>
            </div>

            <div class="email-password">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="email@alunosenai.com">

                <div class="campo-senha">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="*********">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="#7F7F7F" class="size-6" id="mostrar-senha">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </div>

            </div>

            <div class="btns">
                <button type="submit" class="btn-entrar">Entrar</button>

                <div class="btn-google">
                    <img src="../imgs/google-logo.webp" alt="">
                    <button>Continuar com Google</button>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
